name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Check Firebase Token Secret
        if: "${{ env.FIREBASE_TOKEN == '' }}"
        run: |
          echo "::error::FIREBASE_TOKEN secret is missing in GitHub repository settings!"
          echo "Please generate a token with 'npx firebase login:ci' and add it to GitHub Settings -> Secrets -> Actions as FIREBASE_TOKEN."
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting:eat-better-internship --project skillizee-products --non-interactive
