name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Deploy to Firebase Hosting (Service Account)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKILLIZEE_PRODUCTS != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKILLIZEE_PRODUCTS }}"
          channelId: live
          projectId: skillizee-products
          target: eat-better-internship

      - name: Deploy to Firebase Hosting (Token Fallback)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKILLIZEE_PRODUCTS == '' && secrets.FIREBASE_TOKEN != '' }}"
        run: npx firebase-tools deploy --only hosting:eat-better-internship --token "${{ secrets.FIREBASE_TOKEN }}"
